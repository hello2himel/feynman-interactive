# Netlify config for the feynman-interactive mirror.
# Publish the prebuilt static app in site/. No framework, no bundling.
[build]
  publish = "site"
  command = "pip install -q pymupdf && python3 scripts/netlify_build.py"

# Hashed build assets can be cached long; everything else revalidates
# (mirrors serve.py cache behaviour on Hugging Face).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# Correct MIME types for the PDF.js worker and wasm helpers
# (mirrors the mimetypes overrides in serve.py).
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
